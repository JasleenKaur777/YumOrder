<app-header></app-header>
<app-not-found [visible]="!food " notFoundMessage="Product Not Found!" resetLinkText="Go to Home Page"></app-not-found>
<div *ngIf="food" class="container py-5">
  <div class="row align-items-center shadow-lg p-4 rounded bg-white">
    <!-- Food Image -->
    <div class="col-md-6 text-center mb-4 mb-md-0">
      <img [src]="food.imageUrl" [alt]="food.name" class="img-fluid rounded-4 shadow-sm" style="max-height: 400px;">
    </div>

    <!-- Food Details -->
    <div class="col-md-6">
      <h2 class="fw-bold mb-3 text-primary">{{ food.name }}</h2>
      <div class="mb-3">
        <span class="badge bg-success fs-6 me-2">₹{{ food.price }}</span>
        <span class="badge bg-warning text-dark fs-6">{{ food.cookingTime }}</span>
      </div>

      <div class="mb-3">
        <strong>Rating:</strong>
        <ngb-rating [rate]="getFormattedRating(food.stars)" [readonly]="true"></ngb-rating>
        <small class="ms-2 text-muted">({{ food.stars.toFixed(1) }} / 10)</small>
      </div>

      <div class="mb-3">
        <strong>Tags:</strong>
        <span *ngFor="let tag of food.tags" class="badge bg-secondary me-1">{{ tag }}</span>
      </div>

      <div class="mb-4">
        <strong>Origin:</strong>
        <span *ngFor="let origin of food.origins" class="badge bg-info text-dark me-1">{{ origin }}</span>
      </div>

      <button class="btn btn-outline-primary btn-lg" (click)="addToCart()">
        <i class="bi bi-cart-plus me-2"></i> Add to Cart
      </button>
    </div>
  </div>
</div>
