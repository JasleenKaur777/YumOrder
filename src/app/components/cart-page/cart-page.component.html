<app-header></app-header>
<div class="container py-4">
  <h2 class="mb-4">Shopping Cart</h2>
  <div *ngIf="cart.items.length; ">
    <div class="table-responsive">
      <table class="table table-bordered align-middle">
        <thead>
          <tr>
            <th>Image</th>
            <th>Food</th>
            <th>Quantity</th>
            <th>Price (₹)</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of cart.items">
            <td><img [src]="item.food.imageUrl" height="60" class="rounded" [alt]="item.food.name" /></td>
            <td routerLink="/food/{{item.food.id}}" >{{ item.food.name }}</td>
            <td>
              <select #quantitySelect name="" id="quantitySelect" (change)="changeQuantity(item,quantitySelect.value)">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
              </select>
            </td>
            <td>{{ item.price }}</td>
            <td>
              <button class="btn btn-danger btn-sm" (click)="removeItem(item.food.id)">Remove</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="text-end">
      <h4>Total: ₹{{ cart.totalPrice }}</h4>
    </div>
  </div>


</div>
